name: Release AnyWall APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de versión (ej. v0.5)'
        required: true
        default: 'v0.5'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar, Auditar y Publicar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Asegurar Android SDK 35, NDK 27.0.12077973 y CMake 3.22.1
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          test -d "${ANDROID_HOME}/ndk/27.0.12077973" || { echo "::error::No se encontró el NDK 27.0.12077973"; exit 1; }
          test -d "${ANDROID_HOME}/cmake/3.22.1" || { echo "::error::No se encontró CMake 3.22.1"; exit 1; }

      - name: Preparar keystore de firma release
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANYWALL_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.ANYWALL_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANYWALL_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANYWALL_KEY_PASSWORD }}
        run: |
          KS_PATH="${RUNNER_TEMP}/anywall-release.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KS_PATH"
            echo "ANYWALL_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
            echo "ANYWALL_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANYWALL_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANYWALL_KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "Usando keystore persistente configurado en GitHub Secrets."
          else
            GEN_PASS="AnyWallReleaseCI2026!"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias anywall_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$GEN_PASS" \
              -keypass "$GEN_PASS" \
              -dname "CN=AnyWall Universal Converter, OU=SynthesizerEnd, O=AnyWall, L=Local, S=Offline, C=ES"
            echo "ANYWALL_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
            echo "ANYWALL_KEYSTORE_PASSWORD=$GEN_PASS" >> "$GITHUB_ENV"
            echo "ANYWALL_KEY_ALIAS=anywall_release" >> "$GITHUB_ENV"
            echo "ANYWALL_KEY_PASSWORD=$GEN_PASS" >> "$GITHUB_ENV"
            echo "Usando keystore de release generado automáticamente para esta compilación."
          fi

      - name: Compilar APK release y ejecutar pruebas unitarias
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Auditar permisos de red y verificar firma del APK
        id: audit
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          OUT_DIR="${RUNNER_TEMP}/release_assets"
          mkdir -p "$OUT_DIR"
          APK_DST="${OUT_DIR}/AnyWall-${TAG_NAME}-release.apk"
          cp "$APK_SRC" "$APK_DST"

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          fi

          echo "=== Verificando firma con apksigner ==="
          "${BUILD_TOOLS}/apksigner" verify --verbose "$APK_DST"

          echo "=== Auditando permisos del APK final ==="
          PERMS="$("${BUILD_TOOLS}/aapt2" dump permissions "$APK_DST")"
          echo "$PERMS"

          if echo "$PERMS" | grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)"; then
            echo "::error::Se detectó un permiso de red prohibido en el APK final!"
            exit 1
          fi

          (cd "$OUT_DIR" && sha256sum "AnyWall-${TAG_NAME}-release.apk" > SHA256SUMS.txt)
          SHA256="$(awk '{print $1}' "${OUT_DIR}/SHA256SUMS.txt")"
          SIZE_HR="$(du -h "$APK_DST" | awk '{print $1}')"

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_DST}" >> "$GITHUB_OUTPUT"
          echo "sums_path=${OUT_DIR}/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"
          echo "apk_name=AnyWall-${TAG_NAME}-release.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_hr=${SIZE_HR}" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release con el APK adjunto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.audit.outputs.tag }}"
          APK_PATH="${{ steps.audit.outputs.apk_path }}"
          SUMS_PATH="${{ steps.audit.outputs.sums_path }}"
          APK_NAME="${{ steps.audit.outputs.apk_name }}"
          SHA256="${{ steps.audit.outputs.sha256 }}"
          SIZE_HR="${{ steps.audit.outputs.size_hr }}"

          cat > "${RUNNER_TEMP}/release_notes.md" <<EOF
          ## AnyWall: Universal Converter ${TAG}

          Versión release compilada, firmada y auditada automáticamente de **AnyWall: Universal Converter** (\`com.anywall.converter\`), conversor universal para Android desarrollado por **SynthesizerEnd** (licencia \`AGPL-3.0-only\`).

          ### Novedades de v0.5 (Rediseño Integral de UI / UX y Mejoras Táctiles)
          - **Barra de navegación inferior moderna de 5 pestañas (\`NavigationBar\`):**
            1. **Convertir (\`HomeScreen\`):** arranca directamente con la **Selección Rápida por Categoría y Formato Específico** (\`Imágenes\`, \`Documentos / PDF\`, \`Audio / Video\`, \`Comprimidos\`) para que el buscador solicite exclusivamente archivos del formato elegido (\`JPG\`, \`PNG\`, \`PDF\`, \`DOCX\`, \`MP4\`, \`MP3\`, \`RAR\`, \`ZIP\`, etc.), eliminando banners redundantes y presets.
            2. **Estudios (\`ToolsHubScreen\`):** cuadrícula Bento dedicada a los **6 Estudios Táctiles y de Lote** (Estudio de Fotos, Estudio PDF y Firma, Línea de Tiempo Video/Audio, Encuadre de Video, Explorador \`.RAR\`/\`.ZIP\`/\`.7Z\` y Renombrador Masivo).
            3. **Seguridad (\`SecurityAndDataScreen\`):** pestaña propia para **Datos Estructurados (\`JSON\`, \`CSV\`, \`XML\`, \`YAML\`, \`BASE64\`) y Bóveda Criptográfica \`AES-256-GCM\` (\`.anywall\`)** con acciones directas de **Cifrar → \`.anywall\`** y **Desencriptar \`.anywall\`**, además del espacio en pantalla completa para **Duplicados \`SHA-256\`**, **Inspector Forense de Metadatos & Hashes**, **Códigos QR (\`PNG\`/\`SVG\`)**, **Comparador \`Diff\`** y **Comparador \`Antes / Después\`**.
            4. **Historial (\`HistoryScreen\`):** métricas de ahorro, filtro por categoría, búsqueda y multiselección.
            5. **Ajustes (\`SettingsScreen\`):** pantalla completa nativa con muestras circulares de las 6 paletas de acento, modos Claro/Oscuro/Negro AMOLED \`#000000\`, Material You, privacidad EXIF/PIN, caché y **Actualizador desde GitHub Releases (\`GitHubUpdaterDialog\`)**.
          - **Flujo limpio de 3 pasos en \`ConfigureScreen\`:** (1) Cola *Drag & Drop* con tarjetas minimalistas e insignias coloreadas + **Banners Contextuales de Estudios Táctiles**, (2) Selector segmentado de Formato Destino (*Convertir* vs *Comprimir/Extraer*) con estimador de peso en vivo y **Acordeones Colapsables de Opciones Avanzadas**, y (3) **Barra inferior fija (*Sticky Bottom CTA*)** para convertir o desencriptar con 1 toque.
          - **Reproducción de video real por hardware y arrastre táctil fluido a 60 FPS:** \`MediaTimelineTrimmerDialog\` y \`VideoCropDialog\` renderizan video real con \`TextureView\` + \`MediaPlayer.setSurface\` y búsqueda en vivo, y todos los estudios táctiles (PDF firma/anotaciones, Trimmer inicio/fin + \`RangeSlider\`, Foto y cola) usan \`awaitEachGesture\` + \`rememberUpdatedState\` sin interrupciones durante el arrastre.

          ### Características de v0.4 incluidas
          - **Temas:** Sistema, Claro, Oscuro y **Negro AMOLED (\`#000000\`)**, Material You y 6 paletas de acento (Indigo Studio, Esmeralda, Ámbar, Rosa, Cian, Monocromo).
          - **Cola inteligente:** reordenamiento *Drag & Drop*, Vista Rápida (\`QuickPeekDialog\`), estimador de tamaño de salida y **Smart Share Sheet** con acciones según MIME.
          - **Estudio de Fotos 100% táctil:** recorte con 8 tiradores, dial de enderezado \`-45°..+45°\`, proporciones, escáner de perspectiva de 4 esquinas con lupa 2.5×, ajustes en vivo, filtros con miniaturas reales, censura con pincel/rectángulos, texto interactivo, Deshacer/Rehacer, Antes/Después y "Aplicar a todo el lote".
          - **\`.rar\` / \`.rar5\` con \`libarchive\` (\`BSD-2-Clause\`, NDK):** exploración, extracción selectiva, contraseñas, multivolumen \`.part1.rar\`, anti-Zip-Slip y re-empaquetado en 1 paso a \`.zip\`, \`.7z\`, \`.tar.gz\`, \`.tar.xz\`, \`.tar.bz2\`. Cómics \`.cbz\`/\`.cbr\` ↔ PDF / imágenes / \`.cbz\`.
          - **Video y audio táctil:** línea de tiempo con fotogramas o forma de onda, captura de fotograma exacto, recorte de encuadre (\`media3.effect.Crop\`), Auto-Gain \`-1.0 dBFS\` y etiquetas ID3v2.3 + carátula.
          - **Estudio PDF táctil:** *Drag & Drop* de páginas, *pinch-to-zoom*, firma arrastrable/redimensionable, censura con el dedo, texto, sello de fecha y resaltador translúcido.
          - **Herramientas y actualizador:** renombrador masivo con vista previa, limpiador de duplicados por \`SHA-256\` y actualizador provisional desde GitHub Releases (\`GitHubUpdaterDialog\`) con verificador local de APK + \`SHA-256\`.
          - **0 permisos de red** en el APK final (\`INTERNET\`, \`ACCESS_NETWORK_STATE\`, \`ACCESS_WIFI_STATE\`), auditado en CI con \`aapt2 dump permissions\`.

          ### Descarga e integridad
          - **Archivo:** \`${APK_NAME}\` (${SIZE_HR}, firmado con APK Signature Scheme v2)
          - **Android mínimo:** Android 8.0 (API 26) • **Target SDK:** Android 15 (API 35)
          - **SHA-256:** \`${SHA256}\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" "$SUMS_PATH" --clobber
            gh release edit "$TAG" \
              --title "AnyWall: Universal Converter ${TAG}" \
              --notes-file "${RUNNER_TEMP}/release_notes.md"
          else
            gh release create "$TAG" "$APK_PATH" "$SUMS_PATH" \
              --title "AnyWall: Universal Converter ${TAG}" \
              --notes-file "${RUNNER_TEMP}/release_notes.md"
          fi
